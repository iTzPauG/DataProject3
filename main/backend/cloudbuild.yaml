steps:
- name: 'gcr.io/cloud-builders/docker'
  env:
    - DOCKER_BUILDKIT=1
  args:
    - build
    - --no-cache
    - --platform=linux/amd64
    - -t=europe-west1-docker.pkg.dev/project1grupo7/frontend/backend:latest
    - .

images:
  - europe-west1-docker.pkg.dev/project1grupo7/frontend/backend:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
